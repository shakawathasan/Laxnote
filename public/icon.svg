<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23483F" />
      <stop offset="100%" stop-color="#142B25" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB3" />
      <stop offset="100%" stop-color="#D6BD87" />
    </linearGradient>
  </defs>

  <!-- Background with subtle squircle rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer gold subtle border -->
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4" />

  <!-- Inner Notebook Base -->
  <g transform="translate(96, 80)">
    <!-- Notebook Backing -->
    <rect x="24" y="24" width="272" height="320" rx="20" fill="#FAF8F3" />
    <path d="M64 24 L64 344" stroke="#D6BD87" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

    <!-- Legal Scales of Justice Insignia -->
    <g transform="translate(160, 160)" stroke="#23483F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Central Pillar -->
      <line x1="0" y1="-80" x2="0" y2="90" stroke-width="8" />
      <!-- Base of Pillar -->
      <path d="M-40 90 L40 90" stroke-width="8" />
      <!-- Top Finial -->
      <circle cx="0" cy="-80" r="8" fill="#D6BD87" stroke="#23483F" stroke-width="4" />
      <!-- Beam -->
      <line x1="-70" y1="-50" x2="70" y2="-50" stroke-width="7" />

      <!-- Left Scale -->
      <line x1="-70" y1="-50" x2="-95" y2="0" stroke-width="3" />
      <line x1="-70" y1="-50" x2="-45" y2="0" stroke-width="3" />
      <path d="M-105 0 Q-70 24 -35 0 Z" fill="#D6BD87" stroke="#23483F" stroke-width="4" />

      <!-- Right Scale -->
      <line x1="70" y1="-50" x2="45" y2="0" stroke-width="3" />
      <line x1="70" y1="-50" x2="95" y2="0" stroke-width="3" />
      <path d="M35 0 Q70 24 105 0 Z" fill="#D6BD87" stroke="#23483F" stroke-width="4" />
    </g>

    <!-- Law Notes Ruled Lines -->
    <line x1="80" y1="280" x2="260" y2="280" stroke="#E9E5DC" stroke-width="4" stroke-linecap="round" />
    <line x1="80" y1="304" x2="220" y2="304" stroke="#E9E5DC" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
